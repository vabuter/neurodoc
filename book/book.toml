[book]
title = "Neurodoc"
description = "Формат neurodoc и редактор Neurodoc Editor для Windows, Linux и Android: документация как граф знаний из текстовых файлов."
authors = ["Vasily Buter"]
language = "ru"
src = "src"

[build]
build-dir = "build"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/vabuter/neurodoc"
git-repository-icon = "fab-github"
edit-url-template = "https://github.com/vabuter/neurodoc/edit/main/book/{path}"
site-url = "/neurodoc/"

[output.html.search]
enable = true
