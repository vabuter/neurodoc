# Photo — фото растения и его обработка. Файл идёт мимо API: photos.upload_url → PUT в хранилище →
# photos.confirm → фоновая photo-process (EXIF с геометкой вырезается, WebP 1280 px и превью 320 px).
# Вложен в Plant.cover_photo и Plant.photos. Сценарий — «Загрузка фото растения».

dto: Photo
status: live
since: v1
clients: [app, android, server]
summary: "Фото растения и его обработка."

fields:
  id:
    type: id
    required: true
    desc: Выдаёт photos.upload_url; из него же выводятся ключи объектов в корзине fikus-photos
  plant_id:
    type: id
    required: true
  state:
    type: string
    required: true
    enum: [uploading, processing, ready, failed]
    desc: >-
      uploading — ссылка выдана, файла ещё нет (без photos.confirm за час фото удалит photo-orphans);
      processing — идёт photo-process; ready — можно показывать; failed — обработка не удалась, оригинал удалён,
      клиент предлагает загрузить снова
  url:
    type: url
    desc: >-
      Только у ready — WebP 1280 px, подписанная GET-ссылка на 1 ч. Подпись меняет адрес при каждом запросе,
      поэтому кэшировать картинку клиент обязан по id: обработанное фото не меняется никогда
  thumb_url:
    type: url
    desc: Только у ready — превью 320 px для сетки и журнала, подписано так же на 1 ч
  width:
    type: int
    desc: Ширина картинки url в пикселях после обработки — клиент резервирует место до загрузки
  height:
    type: int
    desc: Высота картинки url в пикселях
  taken_at:
    type: time
    desc: Дата съёмки из EXIF, прочитанная до вырезания; хроника роста идёт по ней. Нет в EXIF — поля нет
  created_at:
    type: time
    required: true
    desc: Когда выдана ссылка загрузки

