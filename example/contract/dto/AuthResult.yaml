# AuthResult — результат шага входа: либо сессия с парой токенов, либо следующий шаг. Отдают auth.login,
# auth.confirm_email, auth.reset_complete, auth.totp_verify и auth.refresh. Нужен второй фактор или не подтверждён
# адрес — это исходы в поле state, а не отказы. Токены в golden — короткие выдуманные строки, не JWT.

dto: AuthResult
status: live
since: v1
clients: [app, admin, android, server]
summary: "Результат шага входа: токены или следующий шаг."

fields:
  state:
    type: string
    required: true
    enum: [signed_in, totp_required, email_unconfirmed]
    desc: >-
      signed_in — сессия создана, токены ниже; totp_required — пароль принят, нужен auth.totp_verify с flow_id;
      email_unconfirmed — адрес не подтверждён, письмо confirm_email уходит снова, если прошлому больше 5 мин
  flow_id:
    type: id
    desc: Только при totp_required — flow для auth.totp_verify, продлён на 5 мин
  session_id:
    type: id
    desc: При signed_in — id новой сессии, он же sid в access-токене
  access_token:
    type: string
    desc: >-
      При signed_in — JWT EdDSA (Ed25519) на 15 мин: claims sub, sid, role, iat, exp, iss = api.fikus.example,
      kid в заголовке. Клиент держит его только в памяти
  access_expires_at:
    type: time
    desc: При signed_in — сейчас + 15 мин; клиент обновляет пару за 60 с до этого момента
  refresh_token:
    type: string
    desc: >-
      При signed_in — непрозрачные 32 случайных байта в base64url, в базе только SHA-256. Веб хранит его в IndexedDB,
      Android — в DataStore, зашифрованном ключом Android Keystore
  refresh_expires_at:
    type: time
    desc: При signed_in — сейчас + 30 дней; срок отсчитывается от последнего обновления
  account:
    type: Account
    desc: При signed_in — профиль вошедшего; в ответе auth.refresh поля нет, профиль клиент уже знает
  deletion_cancelled:
    type: bool
    desc: Только со значением true — этот вход отменил отложенное удаление аккаунта; клиент показывает баннер «Удаление отменено»

