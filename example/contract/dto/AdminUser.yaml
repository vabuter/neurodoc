# AdminUser — пользователь глазами администратора: статус, роль и счётчики без личного содержимого — растений,
# журналов и фото админка не видит. Отдают admin.users и admin.user_update; draft вместе с админкой.

dto: AdminUser
status: draft
since: v1
clients: [admin, server]
summary: "Пользователь глазами администратора: статус и счётчики без личного содержимого."

fields:
  id:
    type: id
    required: true
  email:
    type: string
    required: true
    desc: Адрес входа — по его началу ищет admin.users
  display_name:
    type: string
    required: true
  status:
    type: string
    required: true
    enum: [active, unconfirmed, pending_deletion, blocked]
    desc: unconfirmed — адрес не подтверждён; pending_deletion — идут 14 дней до удаления; blocked — заблокирован администратором
  role:
    type: string
    required: true
    enum: [user, admin]
  created_at:
    type: time
    required: true
  last_seen_at:
    type: time
    desc: Последний запрос любой сессии; поля нет, если пользователь ещё не входил
  houses_count:
    type: int
    required: true
    desc: Домов, где пользователь участник в любой роли
  plants_count:
    type: int
    required: true
    desc: Растений во всех его домах, без архивных
  sensors_count:
    type: int
    required: true
    desc: Датчиков во всех его домах
  totp_enabled:
    type: bool
    required: true
  blocked_reason:
    type: string
    desc: Только при blocked — причина, которую указал администратор; пользователю экран её не показывает
  trace_until:
    type: time
    desc: Только пока включена трассировка — когда она выключится сама

