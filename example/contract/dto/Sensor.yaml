# Sensor — датчик Fikus Sense глазами дома: где стоит, на связи ли, заряд, калибровка, последнее показание.
# Отдают sensors.claim, sensors.list, sensors.update, sensors.calibrate и admin.sensors, вложен в Plant.sensor.
# Грунт у датчика не хранится: пороги влажности берутся у растения (Plant.soil). Draft до пилота на 20 датчиках.

dto: Sensor
status: draft
since: v1
clients: [app, admin, android, server]
summary: "Датчик Fikus Sense: состояние, калибровка, последнее показание."

fields:
  id:
    type: id
    required: true
    desc: UUIDv7; в путях API датчик адресуется только им — серийный номер для людей, а не для программ
  serial:
    type: string
    required: true
    desc: Серийный номер FS1-XXXXXX с корпуса — для поддержки; тот же приходит в поле serial каждой пачки
  house_id:
    type: id
    required: true
    desc: Дом, к которому датчик привязан кодом с коробки; отвязать датчик от дома пока можно только через поддержку
  plant_id:
    type: id
    desc: >-
      Растение, в горшке которого стоит датчик, — на растение не больше одного датчика. Поля нет, если датчик
      сняли с растения или растение ушло в архив: датчик остаётся в доме
  name:
    type: string
    required: true
    desc: Имя для людей, 1–40 символов — «Датчик у Бенджи»
  state:
    type: string
    required: true
    enum: [online, offline]
    desc: >-
      offline — 3 ч без пачек (отмечает sensor-watch раз в 5 мин) или пачек ещё не было после привязки;
      первая принятая пачка сразу возвращает online. Без связи план полива возвращается к расписанию
  firmware:
    type: string
    required: true
    desc: Версия прошивки в semver из последней пачки, до первой — заводская; по ней админка считает волны раскатки
  battery_pct:
    type: int
    desc: >-
      Заряд 0–100 % по battery_mv последней пачки; ниже 15 % — тревога battery_low, повторно — только после
      подъёма выше 30 %. Поля нет, пока пачек не было
  last_seen_at:
    type: time
    desc: Когда принята последняя пачка; поля нет, пока датчик ни разу не вышел на связь
  last_reading:
    type: SensorReading
    desc: Последнее показание вместе с moisture_pct — из него плашка влажности на карточке растения
  calibrated:
    type: bool
    required: true
    desc: false — проценты считаются по заводским точкам щупа, true — по точкам пользователя из sensors.calibrate
  raw_dry:
    type: int
    required: true
    desc: Действующая сухая точка — сырое значение щупа в воздухе; при calibrated = false заводская
  raw_wet:
    type: int
    required: true
    desc: Действующая мокрая точка — щуп в стакане воды; сухая всегда выше мокрой не меньше чем на 300 единиц
  claimed_at:
    type: time
    required: true
    desc: Момент привязки к дому

