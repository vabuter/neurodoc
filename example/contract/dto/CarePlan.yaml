# CarePlan — план ухода растения: по пункту на каждый вид задачи, который нужен виду. Считает только сервер
# (алгоритм — «План ухода — серверный алгоритм»), клиенты показывают итог и множители на экране «Почему так».
# Приходит в Plant.plan ответов plants.get и plants.create; golden — зимний план Бенджи из JSON-примера.

dto: CarePlan
status: live
since: v1
clients: [app, android, server]
summary: "План ухода растения: пункт на каждый вид задачи."

fields:
  plant_id:
    type: id
    required: true
  season:
    type: string
    required: true
    enum: [winter, spring, summer, autumn]
    desc: >-
      Сезон по месяцу в поясе дома и полушарию дома: на севере зима — декабрь–февраль, на юге — июнь–август.
      Границу сезона ловит season-replan в 00:10 по поясу дома
  computed_at:
    type: time
    required: true
    desc: >-
      Последний пересчёт по любому из пяти поводов — правка растения, граница сезона, показание датчика,
      отметка задачи, смена вида после модерации. Пересчёт без изменений обновляет computed_at, но событий не шлёт
  items:
    type: list<CarePlanItem>
    required: true
    desc: >-
      Пункты в порядке water, feed, mist, repot, rotate. Вида задачи, которого у вида нет (feed_days или
      mist_days равны 0), в списке нет; задача на паузе остаётся пунктом с paused = true

