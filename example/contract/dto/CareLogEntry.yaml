# CareLogEntry — запись журнала ухода растения. Записи только добавляются: журнал общий для дома, правка задним
# числом лишила бы его доверия («кто на самом деле поливал?»), а план опирается именно на эти факты. Ошибочную
# отметку поясняют заметкой к следующему действию. Отдаёт care.log — новые сверху, курсор по (at, id).

dto: CareLogEntry
status: live
since: v1
clients: [app, android, server]
summary: "Запись журнала ухода; записи только добавляются."

fields:
  id:
    type: id
    required: true
  plant_id:
    type: id
    required: true
  kind:
    type: string
    required: true
    enum: [water, feed, mist, repot, rotate, skip, note, photo, plan, sensor]
    desc: >-
      water, feed, mist, repot, rotate — выполнение задачи; skip — пропуск; photo — фото, отдельно или к отметке;
      plan — пересчёт изменил интервал; sensor — тревога датчика (нет связи, разряд); note — системная запись
      без автора: решение модератора по виду, архивация растения. Заметок пользователя без задачи в MVP нет
  task_kind:
    type: string
    enum: [water, feed, mist, repot, rotate]
    desc: Только у skip и plan — вид задачи, которую пропустили или чей интервал изменился («Пропущен поворот»)
  at:
    type: time
    required: true
    desc: >-
      Момент события: у выполнения — done_at (бывает задним числом), у фото — дата съёмки из EXIF, без неё —
      загрузки. По (at, id) журнал сортируется и режется на страницы
  author_id:
    type: id
    desc: Кто сделал; у системных записей и после удаления аккаунта автора поля нет
  author_name:
    type: string
    desc: >-
      Имя автора на момент ответа; после удаления его аккаунта — «удалённый участник» на языке запрашивающего:
      записи остаются, а личных данных в них больше нет
  task_id:
    type: id
    desc: Задача, по которой сделана отметка; у фото без задачи, plan, sensor и note поля нет
  note:
    type: string
    desc: >-
      Заметка к выполнению или причина пропуска, до 500 символов. У системных записей текст собирает сервер на
      языке запрашивающего аккаунта — в базе лежат код события и параметры: в одном доме бывают ru и en
  amount_ml:
    type: int
    desc: Объём полива в мл; при units = imperial клиент принимает fl oz и переводит сам — сервер хранит метрическое
  photo_id:
    type: id
    desc: Фото записи photo или снимок, приложенный к выполнению; показывается превью 320 px

