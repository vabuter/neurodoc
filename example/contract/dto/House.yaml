# House — дом: общее пространство ухода, которому принадлежат растения, датчики и часовой пояс. Отдают
# houses.list, houses.get, houses.update, houses.vacation и invites.accept; участников (members) — только
# houses.get. Почему пояс у дома, а не у телефона, — ADR-009: растения стоят дома.

dto: House
status: live
since: v1
clients: [app, android, server]
summary: "Дом: настройки, участники, отпуск."

fields:
  id:
    type: id
    required: true
  name:
    type: string
    required: true
    desc: Название, 1–60 символов; при регистрации — «Мой дом» на языке аккаунта
  time_zone:
    type: string
    required: true
    desc: >-
      Пояс IANA, Europe/Moscow. По нему считаются утреннее окно, дайджест в 07:30, день задачи и смена сезона;
      смещение вроде +03:00 не принимается — оно не переживает переход на летнее время
  hemisphere:
    type: string
    required: true
    enum: [north, south]
    desc: Полушарие для сезона плана; по умолчанию его подсказывает пояс (Australia/*, Pacific/Auckland — south)
  morning_window_start:
    type: string
    required: true
    desc: Начало утреннего окна напоминаний, HH:MM по поясу дома, по умолчанию 08:00; с него же начинается срок задач
  morning_window_end:
    type: string
    required: true
    desc: Конец окна, HH:MM, по умолчанию 10:00; окно не короче 30 мин и не переходит через полночь
  my_role:
    type: string
    required: true
    enum: [owner, member, helper]
    desc: Роль запросившего — по ней клиент прячет кнопки, на которые у роли нет прав
  members:
    type: list<HouseMember>
    desc: Только в houses.get — участники по joined_at, до 10 человек вместе с помощниками
  vacation_helper_id:
    type: id
    desc: Помощник отпуска; три поля vacation_* есть, пока отпуск запланирован или идёт, после конца их нет
  vacation_starts_at:
    type: time
    desc: Начало отпуска — с него напоминания по дому получает только помощник
  vacation_ends_at:
    type: time
    desc: Конец отпуска — напоминания возвращаются всем участникам
  plants_count:
    type: int
    required: true
    desc: Растений в доме без архивных, не больше 200
  sensors_count:
    type: int
    required: true
    desc: Датчиков, привязанных к дому
  created_at:
    type: time
    required: true

