    json: '{"created_at":"2026-09-20T17:05:11.284Z","hemisphere":"north","id":"01a0bfc7-6674-75b3-9f0c-50151ec9cc4c","morning_window_end":"10:00","morning_window_start":"08:00","my_role":"owner","name":"Квартира на Лесной","plants_count":4,"sensors_count":3,"time_zone":"Europe/Moscow","vacation_ends_at":"2027-01-13T05:00:00.000Z","vacation_helper_id":"01a2943a-0517-7033-93c0-609f8dec0e5a","vacation_starts_at":"2026-12-30T05:00:00.000Z"}'
