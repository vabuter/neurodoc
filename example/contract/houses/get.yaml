# houses.get — дом целиком: настройки, участники с ролями и сроками доступа, отпуск. Единственная операция,
# которая отдаёт участников: экраны «Участники» и «Отпуск» строятся из неё, а остальным экранам список людей
# не нужен. Права ролей — «Дом и роли участников».

operation: houses.get
kind: request
transport: http
http:
  method: GET
  path: /v1/houses/{house_id}
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Дом целиком: настройки, участники, отпуск."

request:
  house_id:
    type: id
    required: true
    desc: Дом — параметр пути; читать может любой участник, помощник тоже

response: House      # с members по joined_at и полями vacation_*, если отпуск запланирован или идёт

errors:
  - code: not_found
    category: not_found
    desc: Дома нет
  - code: forbidden
    category: forbidden
    desc: Пользователь в доме не состоит — например, у помощника кончился access_until

# 20 декабря после 16:31: трое участников, Вера — помощник до 14 января, отпуск с 30 декабря по 13 января.
