# houses.list — дома, в которых состоит пользователь: «Мой дом» с регистрации и чужие дома, куда он вступил по
# приглашению, — всего до 5. Из него клиент строит переключатель домов на экране «Сегодня». Курсора нет: список
# ограничен по смыслу. Участников здесь нет — их отдаёт houses.get.

operation: houses.list
kind: request
transport: http
http:
  method: GET
  path: /v1/houses
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Дома, в которых состоит пользователь."

request: {}   # параметров нет

response:
  items:
    type: list<House>
    required: true
    desc: >-
      Дома без members, с my_role, plants_count и sensors_count и полями отпуска, если он запланирован или идёт.
      Порядок — сначала дома, где пользователь owner, затем по времени вступления. Помощник с истёкшим
      access_until дом здесь уже не видит

errors: []   # своих отказов нет

golden:
  - name: anna
    part: response
    value:
      items:
        - id: 01a0bfc7-6674-75b3-9f0c-50151ec9cc4c
          name: Квартира на Лесной
          time_zone: Europe/Moscow
          hemisphere: north
          morning_window_start: "08:00"
          morning_window_end: "10:00"
          my_role: owner
          plants_count: 4
          sensors_count: 2
          created_at: "2026-09-20T17:05:11.284Z"
    json: '{"items":[{"created_at":"2026-09-20T17:05:11.284Z","hemisphere":"north","id":"01a0bfc7-6674-75b3-9f0c-50151ec9cc4c","morning_window_end":"10:00","morning_window_start":"08:00","my_role":"owner","name":"Квартира на Лесной","plants_count":4,"sensors_count":2,"time_zone":"Europe/Moscow"}]}'
