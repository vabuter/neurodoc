# care.task_due — напоминание: в доме началось утреннее окно, и есть задачи. Не будильник на каждую задачу, а одна
# сводка на дом и окно; шлёт reminder-scheduler (раз в минуту) с учётом тихих часов получателя и отпуска.
# Клиент не на связи последние 2 мин — вместо события уходит мобильный пуш FCM/APNs. Сценарий — «Доставка напоминания».

operation: care.task_due
kind: push
transport: websocket
channel: /v1/push
event: care.task_due
audience: >-
  получатели напоминания — участники дома, а в режиме отпуска только помощник; из них — соединения, которые были
  на связи последние 2 мин. Тихие часы получателя откладывают событие до их конца
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Напоминание: в доме наступило утреннее окно, есть задачи."

payload:
  house_id:
    type: id
    required: true
    desc: Дом — у кого два дома, тому два события, каждое в окне своего дома
  local_date:
    type: date
    required: true
    desc: День по поясу дома, за который напоминание; по нему клиент открывает «Сегодня» нужного дня
  tasks:
    type: list<CareTask>
    required: true
    desc: >-
      Задачи дня, о которых напоминаем: открытые со сроком в этот день и вчерашние просроченные — просроченную
      напоминают ещё раз на следующее утро, дальше только дайджест письмом
  title:
    type: string
    required: true
    desc: >-
      Готовый текст на языке получателя (ICU MessageFormat, множественное число по правилам языка): «3 растения
      ждут полива», при разных задачах — «4 растения ждут ухода». Клиент показывает его как есть, тот же текст — в пуше

# Событие — подсказка: по нему клиент обновляет «Сегодня» через care.tasks, а не собирает экран из payload.
# Летнее время: несуществующее начало окна сдвигается вперёд до первой существующей минуты.
