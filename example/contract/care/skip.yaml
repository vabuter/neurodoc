# care.skip — пропустить задачу: «в этот раз не нужно». Следующая считается от плановой даты, а не от факта —
# ритм не сбивается; в журнал ложится запись skip с причиной. Задачу уже выполнили — исход already_done, как у
# care.complete. Идемпотентна по Idempotency-Key. Сценарий — «Выполнение задачи ухода».

operation: care.skip
kind: request
transport: http
http:
  method: POST
  path: /v1/tasks/{task_id}/skip
  idempotency_key: true      # повтор после обрыва не пишет в журнал второй пропуск
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Пропустить задачу; следующая считается от плановой даты."

request:
  task_id:
    type: id
    required: true
    desc: Задача — параметр пути; open или snoozed, пропустить может любой участник
  reason:
    type: string
    desc: Причина до 200 символов — «земля ещё влажная»; пишется в журнал, план её не читает

response:
  state:
    type: string
    required: true
    enum: [skipped, already_done]
    desc: skipped — пропуск записан; already_done — задачу успели выполнить, пропуск не нужен и не записан
  task:
    type: CareTask
    required: true
    desc: Задача в итоговом состоянии — skipped или done
  next_task:
    type: CareTask
    desc: Только при skipped — следующая задача того же вида, от плановой даты пропущенной
  done_by_name:
    type: string
    desc: Только при already_done — кто выполнил, как в care.complete

errors:
  - code: task_closed
    category: conflict
    desc: Задачу закрыл пересчёт плана или архивация растения
  - code: invalid_fields
    category: validation
    fields:
      reason: [too_long]

# 10 декабря Борис пропускает поворот Бенджи — плановый срок 10-е, следующий поворот 24-го, как в плане.
