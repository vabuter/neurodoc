# care.tasks — задачи ухода дома за период: из неё собираются экран «Сегодня» (from = to = сегодня) и неделя.
# Даты — дни по поясу дома, а не телефона. Просроченные открытые задачи приходят всегда, пока их не закрыли:
# «Сегодня» показывает их сверху с пометкой «с 17 декабря». Сценарий — «Выполнение задачи ухода».

operation: care.tasks
kind: request
transport: http
http:
  method: GET
  path: /v1/houses/{house_id}/tasks
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Задачи ухода дома за период — экран «Сегодня» и неделя."

request:
  house_id:
    type: id
    required: true
    desc: Дом — параметр пути
  from:
    type: date
    required: true
    desc: Первый день периода по поясу дома, YYYY-MM-DD
  to:
    type: date
    required: true
    desc: Последний день включительно; период не длиннее 31 дня

# Курсора нет: за 31 день при 200 растениях и пяти видах задач список всё равно ограничен.
response:
  items:
    type: list<CareTask>
    required: true
    desc: >-
      Задачи, чей день по поясу дома попадает в период, в любом состоянии (выполненные — серыми, «сделал Борис»),
      день отложенной — по snoozed_until; плюс открытые просроченные до from. Порядок — по due_at, затем по
      прозвищу растения. Пусто — «Сегодня растения отдыхают» и дата ближайшей задачи из plants.list

errors:
  - code: range_too_long
    category: validation
    desc: Период длиннее 31 дня
  - code: invalid_fields
    category: validation
    fields:
      from: [required, invalid_format]
      to: [required, invalid_format, out_of_range]   # to раньше from
  - code: forbidden
    category: forbidden
    desc: Пользователь не состоит в доме

# 19 декабря, 08:01 по Москве, from = to = 2026-12-19: опрыскивание калатеи просрочено с 17-го и идёт первым,
# дальше два полива на сегодня — те же, о которых пришло напоминание care.task_due.
