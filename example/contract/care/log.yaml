# care.log — журнал ухода растения, новые записи сверху: выполнения, пропуски, фото, изменения плана, тревоги
# датчика и системные записи. Журнал растёт без предела, поэтому он курсорный и в plants.get не входит; записи
# только добавляются — общий журнал дома правке задним числом не подлежит.

operation: care.log
kind: request
transport: http
http:
  method: GET
  path: /v1/plants/{plant_id}/log
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Журнал ухода растения, новые записи сверху."

request:
  plant_id:
    type: id
    required: true
    desc: Растение — параметр пути; журнал архивного растения тоже открывается
  cursor:
    type: string
    desc: next_cursor предыдущей страницы; без него — первая страница
  limit:
    type: int
    desc: Записей на странице, по умолчанию 50, максимум 200
  kind:
    type: string
    enum: [water, feed, mist, repot, rotate, skip, photo, plan, sensor, note]
    desc: >-
      Фильтр экрана «Журнал» по виду записи; пропуски с фильтром water приходят тоже — у них task_kind = water,
      иначе фильтр «полив» прятал бы, что полив пропускали

# Курсор непрозрачен: сервер кодирует в него (at, id) последней записи страницы, поэтому новая отметка, пока
# человек листает, не сдвигает страницы, как сдвигал бы offset. Нет next_cursor — страниц больше нет.
response:
  items:
    type: list<CareLogEntry>
    required: true
    desc: Записи по убыванию (at, id); пусто — «Здесь появится история ухода»
  next_cursor:
    type: string
    desc: Курсор следующей страницы

errors:
  - code: invalid_fields
    category: validation
    fields:
      cursor: [invalid_format]          # курсор чужого растения или испорченный
      limit: [out_of_range]
  - code: not_found
    category: not_found
    desc: Растения нет

# Анна открывает журнал Бенджи 19 декабря с limit = 5: полив Бориса, опрыскивание, пропуск поворота, полив
# и фото 6 декабря. Записи старше — на следующей странице.
