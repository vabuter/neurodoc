# plants.get — карточка растения целиком: свойства, план с множителями для «Почему так», все фото, ближайшие
# задачи и датчик. Полный зимний ответ с фото и датчиком — JSON-пример каталога «полный ответ plants.get»;
# golden здесь сокращённый: тот же Бенджи 1 ноября, осенью, до датчика и первого фото.

operation: plants.get
kind: request
transport: http
http:
  method: GET
  path: /v1/plants/{plant_id}
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Карточка растения целиком: план, фото, ближайшие задачи, датчик."

request:
  plant_id:
    type: id
    required: true
    desc: Растение — параметр пути; архивное тоже открывается, только для чтения

# Ответ — Plant в самой полной форме: plan есть всегда, photos — всегда (до 20, пустой список — фото нет),
# next_tasks — до 5 на ближайшие 7 дней. Журнал сюда не входит: он растёт без предела и листается care.log.
response: Plant

errors:
  - code: not_found
    category: not_found
    desc: Растения нет или оно в доме, которого больше нет
  - code: forbidden
    category: forbidden
    desc: Растение в доме, где пользователь не состоит

