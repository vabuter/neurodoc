# plants.list — сетка «Мои растения»: все растения дома одним ответом. Курсора нет намеренно: в доме не больше
# 200 растений, а сетке нужен весь список — для поиска по прозвищу и счётчика. Архив — тот же запрос с
# archived = true (переключатель «Архив»). Экран — «Экраны: растения и уход».

operation: plants.list
kind: request
transport: http
http:
  method: GET
  path: /v1/houses/{house_id}/plants
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Растения дома для сетки «Мои растения»."

request:
  house_id:
    type: id
    required: true
    desc: Дом — параметр пути; owner, member и helper видят одно и то же
  archived:
    type: bool
    desc: false (по умолчанию) — живые растения дома, true — только архив; смешанного списка нет

response:
  items:
    type: list<Plant>
    required: true
    desc: >-
      Растения по прозвищу (сравнение по правилам локали аккаунта); пустой список — экран «Добавить первое
      растение». Форма Plant без plan и photos: cover_photo с подписанными на 1 ч ссылками, sensor с
      last_reading для плашки влажности или «нет связи», next_tasks — одна ближайшая задача

# not_found и forbidden различаются намеренно: id дома — UUIDv7 с 74 случайными битами, перебором его не найти,
# а клиенту forbidden говорит «вас убрали из дома или доступ помощника кончился» — дом пора убрать из переключателя.
errors:
  - code: not_found
    category: not_found
    desc: Дома нет — удалён вместе с последним участником
  - code: forbidden
    category: forbidden
    desc: Дом есть, но пользователь в нём больше не состоит

