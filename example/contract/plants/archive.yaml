# plants.archive — растение не удаляют, а архивируют с причиной: журнал остаётся, история погибшего растения
# лучше всего объясняет, что пошло не так. Открытые задачи закрываются, датчик снимается с растения и остаётся
# в доме, в журнал ложится системная запись. Возврата из архива в MVP нет.

operation: plants.archive
kind: request
transport: http
http:
  method: POST
  path: /v1/plants/{plant_id}/archive
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Архивирование растения вместо удаления: журнал остаётся."

request:
  plant_id:
    type: id
    required: true
    desc: Растение — параметр пути
  reason:
    type: string
    required: true
    enum: [gifted, died, other]
    desc: Подарил, погибло, другое — карточка архивного растения пишет её словами
  note:
    type: string
    desc: Пояснение до 500 символов — ложится в журнал рядом с системной записью об архивации

response: Plant      # archived_at и archive_reason заполнены, next_tasks пуст, sensor нет

# Побочные эффекты одной транзакцией: открытые задачи удаляются (отметка по ним — task_closed), датчик теряет
# plant_id, участникам уходит houses.changed со scope plants. Повтор — already_archived, а не второй архив.
errors:
  - code: already_archived
    category: conflict
    desc: Растение уже в архиве — клиент перезапрашивает карточку
  - code: forbidden
    category: forbidden
    desc: Роль helper
  - code: not_found
    category: not_found
    desc: Растения нет

# 17 января, после отпуска: калатею, за которой ухаживала Вера, Анна дарит ей. Датчик с калатеи переехал ещё 20 декабря.
golden:
  - name: request
    part: request
    value:
      reason: gifted
      note: Подарили Вере — она ухаживала за калатеей, пока нас не было
    json: '{"note":"Подарили Вере — она ухаживала за калатеей, пока нас не было","reason":"gifted"}'
