# plants.create — новое растение в доме; сервер в том же запросе считает план, и карточка открывается уже с
# задачами. Идемпотентна по Idempotency-Key: повтор после обрыва связи не заведёт второе растение. Сценарий —
# «Добавление растения» (вид из поиска или своё название и предложение вида).

operation: plants.create
kind: request
transport: http
http:
  method: POST
  path: /v1/houses/{house_id}/plants
  idempotency_key: true      # заголовок Idempotency-Key: UUID на одно нажатие «Добавить», ответ хранится 24 ч
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Новое растение в доме; сервер сразу считает план ухода."

# Обязательны свойства, без которых план считался бы по выдуманным значениям: материал, дренаж и свет.
request:
  house_id:
    type: id
    required: true
    desc: Дом — параметр пути; заводят owner и member
  species_id:
    type: id
    desc: Вид из species.search; ровно одно из species_id и custom_species_name
  custom_species_name:
    type: string
    desc: >-
      Своё название, 1–60 символов, когда вида нет в справочнике: план — по профилю «обычное комнатное». Ждёт
      модератора предложение автора с тем же названием — растение привязывается к нему (species_pending)
  nickname:
    type: string
    required: true
    desc: Прозвище, 1–40 символов
  pot_material:
    type: string
    required: true
    enum: [plastic, ceramic, clay, glass]
  pot_diameter_cm:
    type: int
    desc: 5–80 см
  pot_drainage:
    type: bool
    required: true
  soil:
    type: string
    enum: [universal, cactus, orchid_bark, peat, custom]
    desc: По умолчанию universal
  location_room:
    type: string
    desc: Комната, до 40 символов
  window:
    type: string
    enum: [north, east, south, west, none]
    desc: По умолчанию none
  light:
    type: string
    required: true
    enum: [low, medium, bright, direct]
  last_watered_at:
    type: time
    desc: >-
      Когда поливали последний раз, не позже текущего момента: от него считается первый полив. Без поля — полив
      завтра в утреннем окне (растение из магазина обычно полито); остальные задачи — через свой интервал от дня создания

response: Plant      # с plan и next_tasks (до 5 на 7 дней); photos нет — фото добавляют после создания

errors:
  - code: invalid_fields
    category: validation
    fields:
      species_id: [required]            # ни вида, ни своего названия — или оба сразу
      custom_species_name: [too_long, not_allowed]
      nickname: [required, too_long]
      pot_diameter_cm: [out_of_range]
      last_watered_at: [out_of_range]   # из будущего
  - code: species_not_found
    category: not_found
    desc: Вида с таким species_id нет или он ещё не одобрен
  - code: house_plant_limit
    category: conflict
    desc: В доме уже 200 растений, архивные не в счёт; клиент пишет «В этот дом больше не поместится»
  - code: forbidden
    category: forbidden
    desc: Роль helper — растения он не заводит, кнопки «Добавить» у него нет

# 28 ноября Борис заводит «Декору»: на ценнике — Ficus decora, в справочнике он такого не нашёл. План — по профилю
# «обычное комнатное», осень; пункта mist нет: опрыскивание профилю не нужно. Через 23 секунды Борис предложит
# вид (species.suggest), а 1 декабря модератор объединит предложение с Ficus elastica.
