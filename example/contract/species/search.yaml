# species.search — поиск вида в справочнике по латинскому и народным названиям: префикс плюс триграммы (pg_trgm),
# поэтому находятся и «бендж», и «benjamina», и «фикус бенжамина» с опечаткой. Только одобренные виды; без
# запроса — популярные. Курсора нет: искать дальше 50-й строки бессмысленно — запрос уточняют.

operation: species.search
kind: request
transport: http
http:
  method: GET
  path: /v1/species
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Поиск вида по латинскому и локальным названиям."

request:
  q:
    type: string
    desc: >-
      Строка поиска, до 60 символов, без учёта регистра и ё/е. Пусто — 20 видов, которые чаще всего заводят
      в Fikus: экран «Добавить растение» открывается не с пустого списка
  limit:
    type: int
    desc: Сколько видов вернуть, по умолчанию 20, максимум 50

response:
  items:
    type: list<Species>
    required: true
    desc: >-
      Виды по убыванию совпадения: сначала префикс названия на языке аккаунта, затем латинского, затем сходство
      триграмм, при равенстве — популярность. Пустой список — экран «нет в списке — предложить» (species.suggest)

errors:
  - code: invalid_fields
    category: validation
    fields:
      q: [too_long]
      limit: [out_of_range]

# Запрос q=фикус&limit=2 — первые две строки выдачи. «Фикус каучуконосный» здесь не найти дословно: в справочнике
# этот вид записан как «Фикус эластика», отсюда предложение вида и его объединение модератором.
