# photos.upload_url — подписанная ссылка PUT на 10 мин для загрузки фото прямо в хранилище, мимо API-сервера
# (ADR-010): гонять фото до 10 МБ через единственный VPS значило бы занимать канал и память fikus-api. Тип и размер
# зашиты в подпись. Идемпотентна по Idempotency-Key. Сценарий — «Загрузка фото растения».

operation: photos.upload_url
kind: request
transport: http
http:
  method: POST
  path: /v1/plants/{plant_id}/photos
  idempotency_key: true      # повтор возвращает ту же photo_id, а не второе фото в лимит
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Подписанная ссылка для прямой загрузки фото в хранилище."

request:
  plant_id:
    type: id
    required: true
    desc: Растение — параметр пути; фото добавляет любой участник, helper — тоже (снимок к отметке задачи)
  content_type:
    type: string
    required: true
    enum: [image/jpeg, image/png, image/heic]
    desc: Тип файла; другой — unsupported_type
  size_bytes:
    type: int
    required: true
    desc: Точный размер файла, не больше 10485760 байт (10 МиБ); клиент проверяет его ещё до запроса

response:
  photo_id:
    type: id
    required: true
    desc: Id будущего фото — Photo в state uploading; без photos.confirm за час его удалит photo-orphans
  upload_url:
    type: url
    required: true
    desc: >-
      Подписанный PUT в корзину fikus-photos (хост из конфигурации, в документации s3.fikus.example), ключ
      photos/<house_id>/<plant_id>/<photo_id>/original. Истекла (хранилище ответило 403) — клиент молча берёт
      новую ссылку, не больше двух раз
  upload_headers:
    type: map<string,string>
    required: true
    desc: >-
      Заголовки, которые клиент отправляет с PUT как есть: Content-Type, Content-Length и x-amz-tagging
      (state=uploaded). Все входят в подпись — по ссылке, выданной на JPEG в 2 МБ, не загрузить 200 МБ видео
  expires_at:
    type: time
    required: true
    desc: Когда ссылка перестанет работать — через 10 мин

errors:
  - code: too_large
    category: validation
    desc: size_bytes больше 10485760 — «Фото больше 10 МБ — выберите другое или уменьшите»
  - code: unsupported_type
    category: validation
    desc: Не JPEG, PNG или HEIC
  - code: plant_photo_limit
    category: conflict
    desc: У растения уже 20 фото; удаление фото — после MVP

# 20 декабря Анна фотографирует монстеру — первое фото станет обложкой. Подпись в golden сокращена.
golden:
  - name: request
    part: request
    value:
      content_type: image/jpeg
      size_bytes: 2481203
    json: '{"content_type":"image/jpeg","size_bytes":2481203}'
  - name: ok
    part: response
    value:
      photo_id: 01a292bb-accd-735b-879d-cd8d72ccaca0
      upload_url: "https://s3.fikus.example/fikus-photos/photos/01a0bfc7-6674-75b3-9f0c-50151ec9cc4c/01a106ea-4a16-7f02-b711-ad00d27fd5e2/01a292bb-accd-735b-879d-cd8d72ccaca0/original?X-Amz-Date=20261220T091502Z&X-Amz-Expires=600&X-Amz-SignedHeaders=content-length%3Bcontent-type%3Bhost%3Bx-amz-tagging&X-Amz-Signature=demo-put-sig"
      upload_headers:
        Content-Type: image/jpeg
        Content-Length: "2481203"
        x-amz-tagging: state=uploaded
      expires_at: "2026-12-20T09:25:02.733Z"
    json: '{"expires_at":"2026-12-20T09:25:02.733Z","photo_id":"01a292bb-accd-735b-879d-cd8d72ccaca0","upload_headers":{"Content-Length":"2481203","Content-Type":"image/jpeg","x-amz-tagging":"state=uploaded"},"upload_url":"https://s3.fikus.example/fikus-photos/photos/01a0bfc7-6674-75b3-9f0c-50151ec9cc4c/01a106ea-4a16-7f02-b711-ad00d27fd5e2/01a292bb-accd-735b-879d-cd8d72ccaca0/original?X-Amz-Date=20261220T091502Z&X-Amz-Expires=600&X-Amz-SignedHeaders=content-length%3Bcontent-type%3Bhost%3Bx-amz-tagging&X-Amz-Signature=demo-put-sig"}'
