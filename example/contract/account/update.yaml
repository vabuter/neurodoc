# account.update — профиль и настройки уведомлений: имя, язык, пояс аккаунта, единицы, дайджест, тихие часы.
# PATCH: нет поля — не трогать; null не допускается, потому что у каждого поля есть значение по умолчанию.
# Пояс аккаунта не двигает напоминания — они идут по поясу дома (ADR-009); тихие часы и дайджест — на схеме «Доставка напоминания».

operation: account.update
kind: request
transport: http
http:
  method: PATCH
  path: /v1/me
status: live
since: v1
clients: [app, android, server]
auth: user
summary: "Изменение профиля и настроек уведомлений."

request:
  display_name:
    type: string
    desc: 1–40 символов
  locale:
    type: string
    enum: [ru, en]
    desc: Язык интерфейса и писем; клиент сразу переключает каталог сообщений
  time_zone:
    type: string
    desc: Пояс IANA — для тихих часов и времени в письмах
  units:
    type: string
    enum: [metric, imperial]
    desc: Только показ — сервер по-прежнему хранит и отдаёт метрические величины
  digest_enabled:
    type: bool
    desc: Ежедневный дайджест письмом в 07:30 по поясу дома
  quiet_hours_start:
    type: string
    desc: HH:MM; тихие часы откладывают пуши и события, но не дайджест
  quiet_hours_end:
    type: string
    desc: HH:MM; конец может быть раньше начала — тогда тихие часы проходят через полночь

response: Account

errors:
  - code: invalid_fields
    category: validation
    fields:
      display_name: [too_short, too_long]
      locale: [not_allowed]
      time_zone: [invalid_format]
      quiet_hours_start: [invalid_format]
      quiet_hours_end: [invalid_format]

golden:
  - name: request
    part: request
    value:
      units: imperial
    json: '{"units":"imperial"}'
  - name: imperial
    part: response
    value:
      id: 01a0bfc7-666f-745d-b25a-a07a8b49c93b
      email: anna@example.com
      email_confirmed: true
      display_name: Анна
      locale: ru
      time_zone: Europe/Moscow
      units: imperial
      role: user
      totp_enabled: false
      digest_enabled: true
      quiet_hours_start: "22:00"
      quiet_hours_end: "08:00"
      created_at: "2026-09-20T17:05:11.279Z"
    json: '{"created_at":"2026-09-20T17:05:11.279Z","digest_enabled":true,"display_name":"Анна","email":"anna@example.com","email_confirmed":true,"id":"01a0bfc7-666f-745d-b25a-a07a8b49c93b","locale":"ru","quiet_hours_end":"08:00","quiet_hours_start":"22:00","role":"user","time_zone":"Europe/Moscow","totp_enabled":false,"units":"imperial"}'
