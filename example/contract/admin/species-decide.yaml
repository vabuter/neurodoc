# admin.species_decide — решение модератора: approve добавляет вид в справочник с профилем ухода, merge привязывает
# растения автора к существующему виду (предложение оказалось синонимом), reject — с причиной, которую увидит автор.
# После approve и merge — пересчёт планов затронутых растений и событие houses.changed со scope plants; решение
# пишется в audit_log и журнал растения. Общие отказы admin.* — в admin.overview. Сценарий — «Предложение нового вида и модерация».

operation: admin.species_decide
kind: request
transport: http
http:
  method: POST
  path: /v1/admin/species/suggestions/{suggestion_id}/decision
status: draft
since: v1
clients: [admin, server]
auth: admin
summary: "Решение по предложенному виду: одобрить, объединить или отклонить."

request:
  suggestion_id:
    type: id
    required: true
    desc: Предложение; параметр пути
  decision:
    type: string
    required: true
    enum: [approve, merge, reject]
  species:
    type: Species
    desc: Только при approve — профиль ухода нового вида без id (интервалы, свет, пороги влажности, токсичность)
  target_species_id:
    type: id
    desc: Только при merge — существующий вид, к которому привязать растения
  reason:
    type: string
    desc: Только при reject, до 300 символов — её увидит автор (не растение, дубль, шутка)

response: SpeciesSuggestion

errors:
  - code: already_decided
    category: conflict
    desc: Решение уже принял другой модератор — клиент перезапрашивает очередь
  - code: species_exists
    category: conflict
    desc: При approve латинское название уже есть в справочнике — нужно merge
  - code: invalid_fields
    category: validation
    fields:
      species: [required]
      target_species_id: [required]
      reason: [required, too_long]

