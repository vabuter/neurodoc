# admin.user_update — блокировка, разблокировка и трассировка пользователя. Блокировка сразу отзывает все его сессии
# (auth.session_revoked с reason blocked), дальше auth.login отвечает account_blocked; каждое изменение пишется в
# audit_log. Трассировка пишет запросы пользователя уровнем debug без паролей, токенов и кодов. Общие отказы admin.* —
# в admin.overview. Описание — «Админка: обзор и пользователи».

operation: admin.user_update
kind: request
transport: http
http:
  method: PATCH
  path: /v1/admin/users/{user_id}
status: draft
since: v1
clients: [admin, server]
auth: admin
summary: "Блокировка, разблокировка и трассировка пользователя."

request:
  user_id:
    type: id
    required: true
    desc: Пользователь; параметр пути
  blocked:
    type: bool
    desc: true — заблокировать, false — разблокировать
  blocked_reason:
    type: string
    desc: Обязательна при blocked = true, до 200 символов; видна только администраторам
  trace_minutes:
    type: int
    desc: Включить трассировку на 1–240 мин; 0 — выключить досрочно

response: AdminUser

errors:
  - code: reason_required
    category: validation
    desc: blocked = true без blocked_reason
  - code: cannot_block_self
    category: validation
    desc: Себя заблокировать нельзя — так администратор не запрёт себе вход в админку
  - code: not_found
    category: not_found
    desc: Пользователя нет или он уже удалён account-purge
  - code: invalid_fields
    category: validation
    fields:
      trace_minutes: [out_of_range]
      blocked_reason: [too_long]

golden:
  - name: request
    part: request
    value:
      blocked: true
      blocked_reason: "По просьбе владелицы: украден телефон с открытой сессией, до сброса пароля"
    json: '{"blocked":true,"blocked_reason":"По просьбе владелицы: украден телефон с открытой сессией, до сброса пароля"}'
  - name: blocked
    part: response
    value:
      id: 01a2943a-0517-7033-93c0-609f8dec0e5a
      email: vera@example.com
      display_name: Вера
      status: blocked
      role: user
      created_at: "2026-12-20T16:12:40.087Z"
      last_seen_at: "2027-02-08T21:14:05.902Z"
      houses_count: 2
      plants_count: 9
      sensors_count: 2
      totp_enabled: false
      blocked_reason: "По просьбе владелицы: украден телефон с открытой сессией, до сброса пароля"
    json: '{"blocked_reason":"По просьбе владелицы: украден телефон с открытой сессией, до сброса пароля","created_at":"2026-12-20T16:12:40.087Z","display_name":"Вера","email":"vera@example.com","houses_count":2,"id":"01a2943a-0517-7033-93c0-609f8dec0e5a","last_seen_at":"2027-02-08T21:14:05.902Z","plants_count":9,"role":"user","sensors_count":2,"status":"blocked","totp_enabled":false}'
