# admin.sensors — парк датчиков Fikus Sense: проблемные датчики по фильтру и распределение версий прошивки по всему
# парку. Сигнал беды — когда онлайн падают все сразу: это приём показаний, а не батарейки. Общие отказы admin.* —
# в admin.overview. Описание — «Админка: здоровье парка датчиков»; раскатка — на схеме «Обновление прошивки по воздуху».

operation: admin.sensors
kind: request
transport: http
http:
  method: GET
  path: /v1/admin/sensors
status: draft
since: v1
clients: [admin, server]
auth: admin
summary: "Парк датчиков: проблемные датчики и версии прошивки."

request:
  state:
    type: string
    enum: [offline, battery_low, outdated]
    desc: offline — тишина больше 3 ч; battery_low — заряд ниже 15 %; outdated — прошивка старше раскатываемой; нет — все датчики
  cursor:
    type: string
    desc: next_cursor из прошлой страницы; страница — limit датчиков
  limit:
    type: int
    desc: Размер страницы, по умолчанию 50, максимум 200

response:
  items:
    type: list<Sensor>
    required: true
    desc: Датчики по фильтру, дольше всех молчащие сверху
  next_cursor:
    type: string
    desc: Нет — страниц больше нет
  firmware_versions:
    type: map<string,int>
    required: true
    desc: Версия прошивки → число датчиков; по всему парку, без учёта фильтра

errors:
  - code: invalid_fields
    category: validation
    fields:
      limit: [out_of_range]

golden:
  - name: ok
    part: response
    value:
      items:
        - id: 01a19d36-1b92-7623-bbca-eb6d4002ae45
