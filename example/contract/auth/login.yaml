# auth.login — пароль в рамках flow из auth.start. Несуществующий адрес и неверный пароль неотличимы ни по ответу,
# ни по времени: argon2id считается и на фиктивном хэше. Нужен второй фактор или не подтверждён адрес — это исходы
# в state, а не отказы. Сценарий — «Вход: identifier-first, вычислительная задача и второй фактор».

operation: auth.login
kind: request
transport: http
http:
  method: POST
  path: /v1/auth/login
status: live
since: v1
clients: [app, admin, android, server]
auth: none
summary: "Вход по паролю в рамках flow."

request:
  flow_id:
    type: id
    required: true
    desc: Поток входа из auth.start
  password:
    type: string
    required: true
    desc: Пароль как введён, сервер приводит его к NFC; в лог не попадает даже при трассировке
  device_name:
    type: string
    desc: Имя устройства для списка сессий и письма о входе, до 64 символов; нет — «Без имени»
  platform:
    type: string
    required: true
    enum: [web, android, ios]
    desc: Пара (platform, device_name), которой у аккаунта не было 90 дней, даёт письмо new_login

response: AuthResult   # signed_in | totp_required (тот же flow_id, продлён на 5 мин) | email_unconfirmed

# Побочные эффекты: email_unconfirmed — confirm_email уходит снова, если прошлое письмо старше 5 мин (операции
# «отправить ещё раз» нет, ADR-012); вход при pending_deletion отменяет удаление (deletion_cancelled, письмо
# deletion_cancelled); незнакомое устройство — письмо new_login; после signed_in flow удаляется.
errors:
  - code: invalid_credentials
    category: auth
    desc: Неверный пароль или адреса нет — ответ один; +1 к счётчику неудач адреса, даже несуществующего
  - code: flow_expired
    category: auth
    desc: Flow не найден или старше 30 мин — клиент возвращается на экран адреса с заполненным полем
  - code: account_blocked
    category: forbidden
    desc: Аккаунт заблокирован; этот отказ приходит только после верного пароля, иначе он выдал бы, что адрес зарегистрирован
  - code: rate_limited
    category: rate_limit
    desc: 10 неудачных паролей на адрес за час — адрес закрыт на 15 мин, retry_after — до конца закрытия

golden:
