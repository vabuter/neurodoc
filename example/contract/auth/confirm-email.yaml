# auth.confirm_email — переход по ссылке https://app.fikus.example/confirm?token=… из письма confirm_email: адрес
# подтверждён, и пользователь сразу входит. Ссылка живёт 24 ч и срабатывает один раз; письма new_login нет — вход
# первый. Устаревшая ссылка не перевыпускается: новое письмо придёт после попытки входа (ADR-012).
# Сценарий — «Регистрация и подтверждение адреса».

operation: auth.confirm_email
kind: request
transport: http
http:
  method: POST
  path: /v1/auth/confirm-email
status: live
since: v1
clients: [app, android, server]
auth: none
summary: "Подтверждение адреса по токену из письма и вход."

request:
  token:
    type: string
    required: true
    desc: Параметр token из ссылки — 32 случайных байта в base64url; в базе только его SHA-256 и срок
  device_name:
    type: string
    desc: Как в auth.login, до 64 символов
  platform:
    type: string
    required: true
    enum: [web, android, ios]

response: AuthResult   # всегда signed_in: email_confirmed = true, токен ссылки погашен, создана сессия

errors:
  - code: link_expired
    category: conflict
    desc: Ссылке больше 24 ч — экран «Ссылка устарела — войдите, письмо придёт снова»
  - code: link_invalid
    category: not_found
    desc: Токен неизвестен или уже использован

golden:
  - name: request
    part: request
    value:
      token: confirm-demo-vera
      device_name: Телефон Веры
      platform: android
    json: '{"device_name":"Телефон Веры","platform":"android","token":"confirm-demo-vera"}'
  - name: signed_in
    part: response
