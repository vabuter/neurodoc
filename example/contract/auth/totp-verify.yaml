    json: '{"access_expires_at":"2026-12-16T07:27:31.250Z","access_token":"access-demo-boris-1","account":{"created_at":"2026-09-22T19:40:02.511Z","digest_enabled":false,"display_name":"Борис","email":"boris@example.com","email_confirmed":true,"id":"01a0caa1-e44f-77de-a33d-1d51c776de69","locale":"en","quiet_hours_end":"07:00","quiet_hours_start":"23:00","role":"user","time_zone":"Europe/Moscow","totp_enabled":true,"units":"metric"},"refresh_expires_at":"2027-01-15T07:12:31.250Z","refresh_token":"refresh-demo-boris-1","session_id":"01a27db2-1012-764b-9e41-c4a7292477fe","state":"signed_in"}'
