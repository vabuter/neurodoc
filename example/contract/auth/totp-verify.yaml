# auth.totp_verify — второй шаг входа после state totp_required: код из приложения-аутентификатора (RFC 6238, 6 цифр,
# шаг 30 с, допуск ±1 шаг) или одноразовый код восстановления. Принимает только flow с отметкой «пароль принят»;
# 5 попыток на flow, код уже принятого шага второй раз не проходит. Сценарий — «Вход: identifier-first,
# вычислительная задача и второй фактор».

operation: auth.totp_verify
kind: request
transport: http
http:
  method: POST
  path: /v1/auth/totp/verify
status: live
since: v1
clients: [app, admin, android, server]
auth: none
summary: "Второй шаг входа: код TOTP или код восстановления."

request:
  flow_id:
    type: id
    required: true
    desc: Flow из ответа totp_required
  code:
    type: string
    desc: 6 цифр из приложения; ровно одно из code и recovery_code
  recovery_code:
    type: string
    desc: Код восстановления XXXX-XXXX (Crockford Base32, регистр и дефис не важны); после входа гаснет

response: AuthResult   # всегда signed_in; вход при pending_deletion отменяет удаление, как в auth.login

errors:
  - code: invalid_code
    category: auth
    desc: Код не подошёл; +1 к попыткам flow, клиент показывает, сколько осталось
  - code: code_reused
    category: auth
    desc: Код этого или более раннего шага уже принят — подсмотренный код бесполезен; ждать следующий
  - code: flow_expired
    category: auth
    desc: Flow истёк — вход с начала
  - code: rate_limited
    category: rate_limit
    desc: Пятая неудача — flow закрыт, клиент возвращается на экран адреса
  - code: invalid_fields
    category: validation
    fields:
      code: [required, invalid_format]          # нет ни code, ни recovery_code
      recovery_code: [not_allowed, invalid_format]   # прислали оба

golden:
