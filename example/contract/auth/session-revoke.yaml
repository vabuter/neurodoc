# auth.session_revoke — отзыв другой сессии из списка «Сессии». Действует сразу: sid попадает в кэш отозванных,
# отозванное устройство получает событие auth.session_revoked с reason revoked_by_user, а его следующий запрос —
# отказ session_revoked. Свою сессию закрывает auth.logout. Сценарий — «Обновление токена и отзыв сессии».

operation: auth.session_revoke
kind: request
transport: http
http:
  method: DELETE
  path: /v1/auth/sessions/{session_id}
status: live
since: v1
clients: [app, admin, android, server]
auth: user
summary: "Отзыв другой сессии аккаунта."

request:
  session_id:
    type: id
    required: true
    desc: Сессия из auth.sessions; параметр пути

response: {}   # токен мобильного пуша отозванной сессии удаляется вместе с ней

errors:
  - code: not_found
    category: not_found
    desc: Сессии нет, она чужая или уже закрыта — клиент обновляет список
  - code: use_logout
    category: validation
    desc: Это текущая сессия — для неё есть auth.logout

golden:
  - name: ok
    part: response
    value: {}
    json: '{}'
