# auth.sessions — вошедшие устройства для экрана «Сессии» (/settings/sessions), свежие сверху; текущая помечена
# current = true. Список ограничен по смыслу, поэтому отдаётся целиком, без курсора. Сценарий — «Обновление токена
# и отзыв сессии» (ветка другого устройства).

operation: auth.sessions
kind: request
transport: http
http:
  method: GET
  path: /v1/auth/sessions
status: live
since: v1
clients: [app, admin, android, server]
auth: user
summary: "Сессии аккаунта — вошедшие устройства, свежие сверху."

request: {}

response:
  items:
    type: list<Session>
    required: true
    desc: Активные сессии по убыванию last_seen_at; отозванных и истёкших нет, одна — «Других устройств нет»

