# sensors.calibrate — шаг двухточечной калибровки щупа: сухая точка (датчик в воздухе), мокрая (щуп в стакане
# воды) или сброс к заводским. Ёмкостный щуп меряет диэлектрическую проницаемость, а не «процент воды», и у каждого
# щупа свой разброс — поэтому калибруется конкретный датчик, а грунт учитывается порогами растения.

operation: sensors.calibrate
kind: request
transport: http
http:
  method: POST
  path: /v1/sensors/{sensor_id}/calibration
status: draft
since: v1
clients: [app, android, server]
auth: user
summary: "Шаг двухточечной калибровки: сухая точка, мокрая точка или сброс."

request:
  sensor_id:
    type: id
    required: true
    desc: Датчик — параметр пути
  step:
    type: string
    required: true
    enum: [dry, wet, reset]
    desc: >-
      dry — запомнить сухую точку; wet — взять мокрую и ввести в силу обе вместе; reset — вернуть заводские.
      Точку сервер берёт из последнего сырого показания не старше 40 мин — один цикл датчика с запасом, —
      поэтому перед шагом нажимают на датчике «отправить сейчас» (не чаще раза в минуту)

# Точки вступают в силу вместе, после wet: сухая точка шага dry ждёт мокрую час, а без неё wet ставится в пару
# к действующей raw_dry — так переделывают одну мокрую точку. Ответ на dry — датчик с прежними точками.
response: Sensor     # после wet — calibrated true, raw_dry и raw_wet новые; после reset — false и заводские

errors:
  - code: no_fresh_reading
    category: conflict
    desc: Последнее показание старше 40 мин — датчик не на связи, нужна свежая пачка
  - code: points_too_close
    category: validation
    desc: >-
      Сухая точка выше мокрой меньше чем на 300 единиц: щуп не дошёл до воды или остался в земле, а такие точки
      растягивают любой шум до десятков процентов. Действующие точки не меняются
  - code: forbidden
    category: forbidden
    desc: Роль helper
  - code: not_found
    category: not_found
    desc: Датчика нет

