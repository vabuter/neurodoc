# sensors.update — имя датчика и растение, над которым он стоит. Грунт у датчика не хранится: пороги влажности
# берутся у растения (Plant.soil), поэтому после переезда они сразу новые. Смена растения пересчитывает планы обоих
# растений: старое возвращается к расписанию, новое начинает слушать датчик. Draft до пилота на 20 датчиках.

operation: sensors.update
kind: request
transport: http
http:
  method: PATCH
  path: /v1/sensors/{sensor_id}
status: draft
since: v1
clients: [app, android, server]
auth: user
summary: "Имя датчика и растение, над которым он стоит."

# Все поля необязательны: нет поля — не трогать.
request:
  sensor_id:
    type: id
    required: true
    desc: Датчик — параметр пути
  name:
    type: string
    desc: Имя, 1–40 символов
  plant_id:
    type: id
    desc: >-
      Растение этого же дома без своего датчика; null — снять с растения, датчик остаётся в доме. Если у нового
      растения другой грунт, приложение предлагает повторить калибровку: щуп всё равно вынут из земли

response: Sensor

# Остальным участникам — houses.changed со scope sensors, а если сдвинулись даты полива — ещё и со scope tasks.
errors:
  - code: invalid_fields
    category: validation
    fields:
      name: [required, too_long]
      plant_id: [not_allowed]           # растение другого дома, архивное или уже с датчиком
  - code: forbidden
    category: forbidden
    desc: Роль helper
  - code: not_found
    category: not_found
    desc: Датчика нет или он привязан к дому, где пользователь не состоит

# 20 декабря: датчик монстеры разрядился и снят на зарядку, Борис переставляет новый датчик с калатеи (на кухне
# плохая связь) на монстеру в спальне.
golden:
  - name: request
    part: request
    value:
      name: Датчик у монстеры
      plant_id: 01a106ea-4a16-7f02-b711-ad00d27fd5e2
