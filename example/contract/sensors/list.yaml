# sensors.list — датчики дома с последними показаниями: экран «Датчики» и плашки на карточках растений. Курсора
# нет: датчиков в доме единицы. Участники видят все датчики дома — датчик принадлежит дому, а не человеку.
# Draft вместе с датчиками — до пилота на 20 датчиках.

operation: sensors.list
kind: request
transport: http
http:
  method: GET
  path: /v1/houses/{house_id}/sensors
status: draft
since: v1
clients: [app, android, server]
auth: user
summary: "Датчики дома с последними показаниями."

request:
  house_id:
    type: id
    required: true
    desc: Дом — параметр пути; owner, member и helper видят одно и то же

response:
  items:
    type: list<Sensor>
    required: true
    desc: >-
      Датчики по времени привязки, с last_reading. Пусто — экран «Подключите Fikus Sense» с кнопкой привязки;
      у helper кнопки нет

errors:
  - code: forbidden
    category: forbidden
    desc: Пользователь не состоит в доме

