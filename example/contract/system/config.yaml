# system.config — первый запрос любого клиента при запуске: минимальные версии, клиентские флаги, режим обслуживания.
# Отвечает и в режиме full (fikus-api пропускает system.config, auth.* и admin.*), поэтому по нему страница
# обслуживания раз в 30 с узнаёт, что работы закончились. Сценарий — «Включение режима обслуживания».

operation: system.config
kind: request
transport: http
http:
  method: GET
  path: /v1/config
status: live
since: v1
clients: [www, app, admin, android, server]
auth: none
summary: "Настройки клиента: минимальные версии, клиентские флаги, режим обслуживания."

request: {}   # параметров нет; язык maintenance_message выбирает заголовок Accept-Language

response:
  min_versions:
    type: map<string,string>
    required: true
    desc: >-
      Минимальные версии клиентов в semver по ключам android и app. Клиент ниже минимума показывает экран
      «Обновите приложение» и дальше не работает; ключа нет — ограничения нет
  flags:
    type: map<string,bool>
    required: true
    desc: >-
      Только клиентские флаги функций — species_suggestions, sensor_pairing_web, ios_beta; серверные, вроде
      digest_email, сюда не попадают. Незнакомый ключ клиент пропускает
  maintenance_mode:
    type: string
    required: true
    enum: ["off", banner, full]
    desc: >-
      off — работаем; banner — API работает, клиенты показывают баннер; full — сайт и веб-приложение закрыты,
      операции, кроме system.config, auth.* и admin.*, отвечают Problem maintenance с retry_after
  maintenance_message:
    type: string
    desc: >-
      Текст баннера при banner и full на языке из Accept-Language: ru — message_ru из admin.maintenance,
      иначе message_en, а если его не задали — тоже message_ru
  maintenance_until:
    type: time
    desc: Плановый конец работ; поля нет, если срок не назван
  push_url:
    type: url
    required: true
    desc: Адрес канала push, wss://api.fikus.example/v1/push; у стенда свой, поэтому клиенты не зашивают его в код
  upload_max_bytes:
    type: int
    required: true
    desc: Предел размера фото, 10485760 байт (10 МиБ); клиент проверяет файл до photos.upload_url

# Клиенты держат ответ в памяти 5 мин, а событие system.maintenance — сигнал перезапросить сразу. HTTP-кэш
# выключен (Cache-Control: no-cache): иначе страница обслуживания, опрашивающая операцию раз в 30 с, не увидела бы снятия режима.
errors: []   # своих отказов нет; если fikus-api недоступен, nginx отвечает за него Problem api_unavailable

golden:
  - name: ok
    part: response
    value:
      min_versions:
        android: "0.9.0"
        app: "0.9.0"
      flags:
        species_suggestions: true
        sensor_pairing_web: false
        ios_beta: false
      maintenance_mode: "off"
      push_url: wss://api.fikus.example/v1/push
      upload_max_bytes: 10485760
    json: '{"flags":{"ios_beta":false,"sensor_pairing_web":false,"species_suggestions":true},"maintenance_mode":"off","min_versions":{"android":"0.9.0","app":"0.9.0"},"push_url":"wss://api.fikus.example/v1/push","upload_max_bytes":10485760}'
  - name: banner
    part: response
    value:
      min_versions:
        android: "0.9.0"
        app: "0.9.0"
      flags:
        species_suggestions: true
        sensor_pairing_web: false
        ios_beta: false
      maintenance_mode: banner
      maintenance_message: Плановые работы 14 марта с 03:00 до 03:30 UTC
      maintenance_until: "2026-03-14T03:30:00.000Z"
      push_url: wss://api.fikus.example/v1/push
      upload_max_bytes: 10485760
    json: '{"flags":{"ios_beta":false,"sensor_pairing_web":false,"species_suggestions":true},"maintenance_message":"Плановые работы 14 марта с 03:00 до 03:30 UTC","maintenance_mode":"banner","maintenance_until":"2026-03-14T03:30:00.000Z","min_versions":{"android":"0.9.0","app":"0.9.0"},"push_url":"wss://api.fikus.example/v1/push","upload_max_bytes":10485760}'
