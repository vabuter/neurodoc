# Шаблон push-события канала wss://api.fikus.example/v1/push: копия файла — начало нового события
# contract/<домен>/<событие-через-дефис>.yaml. Как работает канал — в файле «Канал push: WebSocket /v1/push»,
# имена и типы — в «Соглашениях контракта API». Пример — выдуманное событие example.pinged.

# Конверт кадра события добавляет канал, в payload он не описывается:
#   {"at":"2026-03-14T07:30:00.000Z","id":"019ceb40-84c0-7a3e-8f21-5b6c7d8e9f01","payload":{…},"type":"example.pinged"}
#   id — UUIDv7 события: по нему клиент отсекает дубли (доставка «не меньше одного раза») и после
#   переподключения передаёт его как last_event_id; type — имя события (= event); at — момент на сервере (time).
# Служебные кадры общие для всех событий:
#   hello — первый кадр клиента: access-токен и last_event_id; токен в кадре, а не в адресе — браузерный
#     WebSocket не умеет заголовок Authorization, а адрес с токеном осел бы в логах;
#   welcome — last_event_id найден в буфере (10 мин событий аккаунта), следом досылка пропущенного;
#   reset — не найден: клиент перезапрашивает операциями всё, что показывает;
#   ping — каждые 30 с с обеих сторон; два пропущенных — обрыв, переподключение с паузами 1 → 2 → 4 … 60 с;
#   закрытие кодом 4401 — истёк access-токен (auth.refresh и снова hello) или сессия отозвана.

operation: example.pinged         # = имя события в snake_case
kind: push                        # события канала — всегда push
transport: websocket
channel: /v1/push                 # канал один на все события
event: example.pinged             # значение type в конверте
audience: участники дома, кроме того, кто позвал   # кому уходит — словами: по этому правилу сервер выбирает соединения
status: draft                     # draft | live | deprecated — как у операций
since: v1
clients: [app, android, server]   # кто слушает: app | admin | android | ios; server — отправляет fikus-api
auth: user                        # события получают только соединения вошедшего пользователя
summary: "Участник дома позвал остальных посмотреть на растение — пример формы события."

# payload описывается как request операции: type, required, enum, desc. Событие — подсказка, а не данные: оно
# говорит, что изменилось, состояние клиент берёт операциями, и потерянное событие не ломает экран. Дублирует ли
# событие мобильный пуш (FCM/APNs) для закрытого клиента — пишется в desc.
payload:
  house_id:
    type: id
    required: true
    desc: Дом, в котором позвали
  plant_id:
    type: id
    required: true
    desc: Растение, на которое зовут посмотреть
  by:
    type: id
    required: true
    desc: Кто позвал — id аккаунта
  note:
    type: string
    desc: Подпись до 80 символов, если её оставили

# Golden события — только payload (part: payload); конверт и служебные кадры проверяют тесты самого канала.
golden:
  - name: pinged
    part: payload
    value:
      house_id: 01a0bfc7-6674-75b3-9f0c-50151ec9cc4c
      plant_id: 01a106e6-1f92-7a2d-a21c-7b73545b7677
      by: 01a0bfc7-666f-745d-b25a-a07a8b49c93b
      note: Бенджи выпустил новый лист
    json: '{"by":"01a0bfc7-666f-745d-b25a-a07a8b49c93b","house_id":"01a0bfc7-6674-75b3-9f0c-50151ec9cc4c","note":"Бенджи выпустил новый лист","plant_id":"01a106e6-1f92-7a2d-a21c-7b73545b7677"}'
